services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synqo
      POSTGRES_USER: synqo
      POSTGRES_PASSWORD: synqo
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synqo -d synqo']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
