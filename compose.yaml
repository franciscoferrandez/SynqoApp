name: synqo-equ-001

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synqo}
      POSTGRES_USER: ${POSTGRES_USER:-synqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synqo-local}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-synqo_test}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init/10-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synqo} -d ${POSTGRES_DB:-synqo}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: apps/api
    working_dir: /app
    volumes:
      - ./apps/api:/app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-local-only-synqo-secret}
      TEAM_DELETION_RETENTION_DAYS: ${TEAM_DELETION_RETENTION_DAYS-90}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4200}
      SYNQO_DEPLOYMENT_ENV: ${SYNQO_DEPLOYMENT_ENV:-development}
      TEAM_CREATION_LIMIT: ${TEAM_CREATION_LIMIT:-}
      TEAM_CREATION_WINDOW_MINUTES: ${TEAM_CREATION_WINDOW_MINUTES:-}
      TEAM_CREATION_EMAIL_MODE: ${TEAM_CREATION_EMAIL_MODE:-}
      DEMO_PANEL_ENABLED: ${DEMO_PANEL_ENABLED:-}
      DEMO_RESET_SCHEDULE_ENABLED: ${DEMO_RESET_SCHEDULE_ENABLED:-}
      DEMO_ACCESS_SECRET: ${DEMO_ACCESS_SECRET:-}
      DEMO_TEAM_IDS: ${DEMO_TEAM_IDS-}
      DEMO_DATABASE_HOST: ${DEMO_DATABASE_HOST:-database}
      MAIL_EVENT_KEY:
      MAIL_EVENT_TTL_SECONDS: ${MAIL_EVENT_TTL_SECONDS:-1800}
      MAILER_DSN: smtp://mailpit:1025
      DATABASE_URL: postgresql://${POSTGRES_USER:-synqo}:${POSTGRES_PASSWORD:-synqo-local}@database:5432/${POSTGRES_DB:-synqo}?serverVersion=18&charset=utf8
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER:-synqo}:${POSTGRES_PASSWORD:-synqo-local}@database:5432/${POSTGRES_TEST_DB:-synqo_test}?serverVersion=18&charset=utf8
      POSTGRES_DB: ${POSTGRES_DB:-synqo}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-synqo_test}
    ports:
      - "${API_PORT:-8000}:8000"
    command: php -S 0.0.0.0:8000 -t public
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started

  api-e2e:
    build:
      context: apps/api
    working_dir: /app
    profiles: [e2e]
    volumes:
      - ./apps/api:/app
    environment:
      APP_ENV: test
      APP_SECRET: ${APP_SECRET:-local-only-synqo-secret}
      APP_PUBLIC_URL: http://localhost:4200
      SYNQO_DEPLOYMENT_ENV: test
      TEAM_CREATION_LIMIT: 10000
      TEAM_CREATION_WINDOW_MINUTES: 60
      MAILER_DSN: null://null
      DATABASE_URL: postgresql://${POSTGRES_USER:-synqo}:${POSTGRES_PASSWORD:-synqo-local}@database:5432/synqo_e2e_disabled?serverVersion=18&charset=utf8
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER:-synqo}:${POSTGRES_PASSWORD:-synqo-local}@database:5432/${POSTGRES_TEST_DB:-synqo_test}?serverVersion=18&charset=utf8
      POSTGRES_DB: ${POSTGRES_DB:-synqo}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-synqo_test}
    command: php -S 0.0.0.0:8000 -t public
    depends_on:
      database:
        condition: service_healthy

  mail-worker:
    build:
      context: apps/api
    working_dir: /app
    volumes:
      - ./apps/api:/app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-local-only-synqo-secret}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4200}
      SYNQO_DEPLOYMENT_ENV: ${SYNQO_DEPLOYMENT_ENV:-development}
      TEAM_CREATION_EMAIL_MODE: ${TEAM_CREATION_EMAIL_MODE:-}
      MAIL_EVENT_KEY:
      MAIL_EVENT_TTL_SECONDS: ${MAIL_EVENT_TTL_SECONDS:-1800}
      MAILER_DSN: smtp://mailpit:1025
      DATABASE_URL: postgresql://${POSTGRES_USER:-synqo}:${POSTGRES_PASSWORD:-synqo-local}@database:5432/${POSTGRES_DB:-synqo}?serverVersion=18&charset=utf8
    command: php bin/console app:mail:process
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  web-visual-test:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /workspace/apps/web
    init: true
    ipc: host
    environment:
      CI: "1"
    volumes:
      - ./:/workspace
      - visual-web-node-modules:/workspace/apps/web/node_modules

volumes:
  postgres-data:
  visual-web-node-modules:
