name: synqo-equ-001

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synqo}
      POSTGRES_USER: ${POSTGRES_USER:-synqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synqo-local}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-synqo_test}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init/10-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synqo} -d ${POSTGRES_DB:-synqo}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: apps/api
    working_dir: /app
    volumes:
      - ./apps/api:/app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-local-only-synqo-secret}
      TEAM_DELETION_RETENTION_DAYS: ${TEAM_DELETION_RETENTION_DAYS-90}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4200}
      TEAM_CREATION_EMAIL_ENABLED: ${TEAM_CREATION_EMAIL_ENABLED:-true}
      MAIL_EVENT_KEY:
      MAIL_EVENT_TTL_SECONDS: ${MAIL_EVENT_TTL_SECONDS:-1800}
      MAILER_DSN: smtp://mailpit:1025
      DATABASE_URL: postgresql://${POSTGRES_USER:-synqo}:${POSTGRES_PASSWORD:-synqo-local}@database:5432/${POSTGRES_DB:-synqo}?serverVersion=18&charset=utf8
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER:-synqo}:${POSTGRES_PASSWORD:-synqo-local}@database:5432/${POSTGRES_TEST_DB:-synqo_test}?serverVersion=18&charset=utf8
    ports:
      - "${API_PORT:-8000}:8000"
    command: php -S 0.0.0.0:8000 -t public
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started

  mail-worker:
    build:
      context: apps/api
    working_dir: /app
    volumes:
      - ./apps/api:/app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-local-only-synqo-secret}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4200}
      TEAM_CREATION_EMAIL_ENABLED: ${TEAM_CREATION_EMAIL_ENABLED:-true}
      MAIL_EVENT_KEY:
      MAIL_EVENT_TTL_SECONDS: ${MAIL_EVENT_TTL_SECONDS:-1800}
      MAILER_DSN: smtp://mailpit:1025
      DATABASE_URL: postgresql://${POSTGRES_USER:-synqo}:${POSTGRES_PASSWORD:-synqo-local}@database:5432/${POSTGRES_DB:-synqo}?serverVersion=18&charset=utf8
    command: php bin/console app:mail:process
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
