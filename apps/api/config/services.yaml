# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(TEAM_DELETION_RETENTION_DAYS): '90'
    env(MAIL_EVENT_KEY): ''
    env(MAIL_EVENT_TTL_SECONDS): '1800'
    env(MAIL_FROM): 'Synqo <no-reply@synqo.local>'
    env(TEAM_CREATION_EMAIL_ENABLED): 'false'
    env(SYNQO_DEPLOYMENT_ENV): 'development'
    env(TEAM_CREATION_LIMIT): ''
    env(TEAM_CREATION_WINDOW_MINUTES): ''
    env(DEMO_ACCESS_SECRET): ''
    env(DEMO_RESET_ENABLED): 'false'
    env(DEMO_DATABASE_HOST): ''
    env(RAILWAY_ENVIRONMENT_NAME): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Infrastructure\OpenApi\TeamOpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments: ['@.inner']

    App\Application\Team\TeamService:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'
            $mailAttemptTtlSeconds: '%env(int:MAIL_EVENT_TTL_SECONDS)%'
            $teamCreationEmailEnabled: '%env(bool:TEAM_CREATION_EMAIL_ENABLED)%'
            $creationOriginHashSecret: '%env(APP_SECRET)%'

    App\Application\Team\CreationLimitPolicy:
        arguments:
            $deploymentEnvironment: '%env(SYNQO_DEPLOYMENT_ENV)%'
            $maxTeamsOverride: '%env(TEAM_CREATION_LIMIT)%'
            $windowMinutesOverride: '%env(TEAM_CREATION_WINDOW_MINUTES)%'

    App\Application\Demo\DemoAccessTokenDeriver:
        arguments:
            $secret: '%env(DEMO_ACCESS_SECRET)%'

    App\Infrastructure\Persistence\OrmDemoResetRepository:
        arguments:
            $deploymentEnvironment: '%env(SYNQO_DEPLOYMENT_ENV)%'

    App\Controller\PublicConfigurationController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $teamCreationEmailEnabled: '%env(bool:TEAM_CREATION_EMAIL_ENABLED)%'
            $deploymentEnvironment: '%env(SYNQO_DEPLOYMENT_ENV)%'
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Infrastructure\Mail\SodiumPayloadCipher:
        arguments:
            $encodedKey: '%env(MAIL_EVENT_KEY)%'
    App\Application\Mail\PayloadCipher: '@App\Infrastructure\Mail\SodiumPayloadCipher'

    App\Infrastructure\Mail\SymfonyTeamLinkMailer:
        arguments:
            $from: '%env(MAIL_FROM)%'
    App\Application\Mail\TeamLinkMailer: '@App\Infrastructure\Mail\SymfonyTeamLinkMailer'

    App\Application\Mail\MailAttemptProcessor:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'
            $teamCreationEmailEnabled: '%env(bool:TEAM_CREATION_EMAIL_ENABLED)%'
    App\Application\Mail\MailAttemptRepository: '@App\Infrastructure\Persistence\OrmMailAttemptRepository'
    App\Controller\MailAttemptController:
        public: true
        tags: ['controller.service_arguments']
    App\Controller\ApiNotFoundController:
        public: true
        tags: ['controller.service_arguments']

    App\Application\Team\TeamRepository: '@App\Infrastructure\Persistence\OrmTeamRepository'
    App\Application\Team\IdentifierGenerator: '@App\Infrastructure\Identity\UuidGenerator'
    App\Application\Team\AccessTokenGenerator: '@App\Infrastructure\Identity\CryptographicAccessTokenGenerator'

    App\Controller\TeamController:
        public: true
        tags: ['controller.service_arguments']

    App\Application\Availability\AvailabilityRepository: '@App\Infrastructure\Persistence\OrmAvailabilityRepository'
    App\Controller\AvailabilityController:
        public: true
        tags: ['controller.service_arguments']

    App\Application\Consultation\ConsultationRepository: '@App\Infrastructure\Persistence\OrmConsultationRepository'
    App\Controller\ConsultationController:
        public: true
        tags: ['controller.service_arguments']

    App\Domain\Team\TeamDeletionPolicy:
        arguments:
            $retentionDays: '%env(TEAM_DELETION_RETENTION_DAYS)%'

    App\Application\Team\TeamCleanupRepository: '@App\Infrastructure\Persistence\OrmTeamCleanupRepository'
