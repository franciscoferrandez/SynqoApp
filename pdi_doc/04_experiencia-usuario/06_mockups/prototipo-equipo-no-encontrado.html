<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synqo · equipo no encontrado</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;--app:#f4f7ff;--surface:#fff;--line:#d9e2f2;--ink:#0b174a;--muted:#526184;--blue:#2349d7;--soft:#edf3ff;--shadow:0 14px 42px #18327313;--focus:#0050cf}
html[data-theme="dark"]{color-scheme:dark;--app:#07101f;--surface:#101b2f;--line:#304161;--ink:#f6f8ff;--muted:#bbc8e8;--blue:#a4b8ff;--soft:#172846;--shadow:0 18px 46px #0006;--focus:#72d9ff}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--app);color:var(--ink)}select{font:inherit}.preview{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:#091946;color:#fff;padding:.6rem max(1rem,calc((100vw - 1100px)/2));font-size:.82rem}.theme-picker{display:flex;align-items:center;gap:.5rem}.preview select{background:#243e86;color:#fff;border:1px solid #7592ea;border-radius:999px;padding:.35rem .8rem}select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.app{max-width:1100px;margin:auto;padding:1rem 1.2rem}.brand{display:flex;align-items:center;gap:.6rem;font-size:1.35rem;font-weight:800;letter-spacing:-.04em}.brandmark{width:28px;height:36px;border-radius:55% 40% 60% 45%;background:linear-gradient(155deg,#5b64ff 0 42%,#20bbf3 43% 73%,#23d4a5 74%);transform:rotate(20deg)}main{min-height:calc(100vh - 160px);display:grid;place-items:center}.panel{width:min(100%,580px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:clamp(1.2rem,4vw,2.2rem)}.symbol{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--soft);color:var(--blue);font-size:1.6rem}.eyebrow{margin-top:1.3rem;color:var(--blue);font-size:.76rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}h1{font-size:clamp(1.8rem,4vw,2.5rem);letter-spacing:-.05em;margin:.45rem 0 .65rem}p{color:var(--muted);line-height:1.55;margin:0;max-width:36rem}@media(max-width:600px){.app{padding:.85rem}.preview{padding:.6rem .85rem}main{min-height:calc(100vh - 140px)}.panel{padding:1.3rem}}
</style>
</head>
<body>
<div class="preview"><span>Propuesta visual · enlace no encontrado</span><div class="theme-picker"><label for="theme">Tema</label><select id="theme"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></div></div>
<div class="app"><header class="brand"><span class="brandmark" aria-hidden="true"></span><span>Synqo</span></header><main><section class="panel" aria-labelledby="title"><div class="symbol" aria-hidden="true">?</div><div class="eyebrow">Enlace de equipo</div><h1 id="title">No encontramos este equipo</h1><p>No encontramos ningún equipo para este enlace. Comprueba que lo hayas abierto completo.</p></section></main></div>
<script>
const root=document.documentElement,selector=document.getElementById('theme');
let deviceTheme;
try{deviceTheme=window.matchMedia?.('(prefers-color-scheme: dark)')}catch{}
let preference='auto';
try{const saved=window.localStorage?.getItem('synqo:theme');if(['auto','light','dark'].includes(saved))preference=saved}catch{}
selector.value=preference;
function renderTheme(){root.dataset.theme=preference==='auto'?(deviceTheme?.matches?'dark':'light'):preference}
renderTheme();
deviceTheme?.addEventListener?.('change',()=>{if(preference==='auto')renderTheme()});
selector.addEventListener('change',()=>{preference=selector.value;try{window.localStorage?.setItem('synqo:theme',preference)}catch{}renderTheme()});
</script>
</body>
</html>
