name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  browser-smoke:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @synqo/web exec playwright install --with-deps chromium
      - run: docker compose up -d --wait postgres
      - run: pnpm db:migrate
      - run: pnpm --filter @synqo/api start > /tmp/synqo-api.log 2>&1 &
      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/synqo-api.log
          exit 1
      - run: pnpm test:e2e
